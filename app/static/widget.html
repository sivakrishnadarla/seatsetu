<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/static/favicon.png">
<meta name="theme-color" content="#0D9488">
<title>SeatSetu — Admissions Chat</title>
<style>
  :root{--acc:#0D9488;--acc2:#0F766E;--bg:#F7FAF9;--panel:#ffffff;--txt:#12332E;--mut:#5B7470;--line:#DCE9E6}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,-apple-system,'Segoe UI',sans-serif}
  body{background:var(--bg);height:100vh;display:flex;flex-direction:column;color:var(--txt)}
  header{background:linear-gradient(135deg,#0D9488,#0F766E);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px #0002}
  header .dot{width:9px;height:9px;background:#6ee7b7;border-radius:50%;box-shadow:0 0 0 3px #6ee7b744}
  header b{font-size:15px}header span{font-size:11px;opacity:.85;display:block}
  #log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px}
  .msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;box-shadow:0 1px 2px #0001}
  .msg.parent{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:0 1px 3px #0d948814}
  .cite{display:block;margin-top:6px;font-size:11px;color:#0F766E}
  .flag{display:block;margin-top:6px;font-size:11px;color:#b45309}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px}
  .chip{background:#fff;border:1px solid var(--line);color:var(--mut);font-size:11.5px;padding:6px 10px;border-radius:99px;cursor:pointer}
  .chip:hover{border-color:var(--acc);color:var(--txt)}
  .composer{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
  .composer input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px}
  .composer button{background:var(--acc);border:0;color:#fff;width:46px;border-radius:10px;cursor:pointer;font-size:17px}
  .consent{background:#FEF3C7;border:1px solid #F59E0B55;font-size:11px;color:#92400E;padding:9px 12px;display:flex;gap:8px;align-items:center}
  .consent input{accent-color:var(--acc)}
  .typing{align-self:flex-start;font-size:12px;color:var(--mut);padding:6px 10px}
</style>
</head>
<body>
<header><div class="dot"></div><div><b id="colName">SeatSetu Chat</b><span>AI counselor · replies instantly · 9am-9pm counselor callback available</span></div></header>
<div id="log"></div>
<div class="chips" id="chips">
  <span class="chip" onclick="quick('CSE fee enta? hostel unda?')">CSE fee enta? hostel unda?</span>
  <span class="chip" onclick="quick('What are your placements?')">Placements?</span>
  <span class="chip" onclick="quick('Bus route Proddatur nunchi unda?')">Bus route?</span>
  <span class="chip" onclick="quick('Admission ela join avvali?')">Admission process?</span>
  <span class="chip" onclick="quick('100% placement guarantee unda?')">Placement guarantee?</span>
</div>
<div class="consent" id="consentBar">
  <input type="checkbox" id="consentBox">
  <label for="consentBox">I agree that the college may contact me about admissions (DPDP consent). <b>Optional</b> — needed only if you share your number.</label>
</div>
<div style="text-align:center;font-size:11.5px;color:#62807a;padding:3px">Powered by <a href="https://poojasoftsolutions.com" target="_blank" rel="noopener" style="color:#0F766E;font-weight:600;text-decoration:none">Pooja Soft Solutions</a> · <a href="tel:+919247105525" style="color:#0F766E;text-decoration:none">📞 92471 05525</a></div><div class="composer">
  <input id="in" placeholder="Type in Telugu or English…" onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">➤</button>
</div>
<script>
const parts=location.pathname.split('/');const CID=parts[parts.length-1];
let convId=null;
const $=q=>document.querySelector(q);
(async function(){try{const i=await (await fetch(`/api/widget/${CID}/info`)).json();
  $('#colName').textContent=(i.short||i.name)+' — AI Counselor';
  addMsg('ai',`నమస్తే! 🙏 / Hello! I'm the ${i.short||i.name} AI counselor. Ask me about courses, fees, hostel, bus routes or placements — in Telugu or English.`);}catch(e){$('#colName').textContent='Admissions Chat'}})();
function addMsg(role,text,cites,flag){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;
  if(cites&&cites.length){const c=document.createElement('span');c.className='cite';c.textContent='📚 '+cites.map(x=>x.title).join(' · ');d.appendChild(c)}
  if(flag){const f=document.createElement('span');f.className='flag';f.textContent='✓ answered honestly from approved data only';d.appendChild(f)}
  $('#log').appendChild(d);$('#log').scrollTop=1e9}
function quick(t){$('#in').value=t;send()}
async function send(){const t=$('#in').value.trim();if(!t)return;$('#in').value='';addMsg('parent',t);
  const ty=document.createElement('div');ty.className='typing';ty.textContent='typing…';$('#log').appendChild(ty);$('#log').scrollTop=1e9;
  try{const r=await (await fetch(`/api/chat/${CID}`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:t,channel:'web',conversation_id:convId,consent_given:$('#consentBox').checked})})).json();
    ty.remove();convId=r.conversation_id;addMsg('ai',r.reply,r.citations,r.flagged)}
  catch(e){ty.remove();addMsg('ai','Our counselor will help you shortly — the college office is at 9am-5pm. (Error: '+e.message+')')}}
</script>
</body>
</html>
